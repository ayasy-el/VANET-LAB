[General]
network = vanet_aodv.Scenario
sim-time-limit = 100s
debug-on-errors = true
cmdenv-express-mode = true
image-path = ../veins_inet/images;../inet/images;../veins/images

##########################################################
#                Veins Scenario Manager                  #
##########################################################
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("maps.launchd.xml")
*.manager.moduleType = "vanet_aodv.VeinsAodvCar"
*.manager.moduleName = "node"

##########################################################
#                  Physical Environment                  #
##########################################################
*.physicalEnvironment.config = xmldoc("empty.xml")
*.radioMedium.backgroundNoise.power = -110dBm
*.radioMedium.mediumLimitCache.centerFrequency = 5.9 GHz

##########################################################
#              IEEE 802.11p NIC Configuration            #
##########################################################
*.node[*].wlan[0].opMode = "p"
*.node[*].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.node[*].wlan[0].radio.bandName = "5.9 GHz"
*.node[*].wlan[0].radio.channelNumber = 3
*.node[*].wlan[0].radio.bandwidth = 10 MHz
*.node[*].wlan[0].radio.transmitter.power = 10mW

*.node[*].wlan[*].radio.antenna.mobility.typename = "AttachedMobility"
*.node[*].wlan[*].radio.antenna.mobility.mobilityModule = "^.^.^.^.mobility"
*.node[*].wlan[*].radio.antenna.mobility.offsetX = -2.5m
*.node[*].wlan[*].radio.antenna.mobility.offsetZ = 1.5m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMinX = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMaxX = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMinY = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMaxY = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMinZ = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMaxZ = 0m

##########################################################
#                   Mobility Settings                    #
##########################################################
*.node[*].mobility.typename = "VeinsInetMobility"

##########################################################
#               IPv4 Network Layer & ARP                 #
##########################################################
*.node[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.node[*].ipv4.configurator.interfaces = "wlan0"
*.node[*].ipv4.configurator.addressBase = "10.0.0.0"
*.node[*].ipv4.configurator.netmask = "255.0.0.0"
*.node[*].ipv4.configurator.mcastGroups = "224.0.0.1"
*.node[*].ipv4.arp.typename = "GlobalArp"

##########################################################
#             AODV Routing Protocol Parameters           #
##########################################################
**.aodv.interface = "wlan0"
**.aodv.activeRouteTimeout = 3s
**.aodv.useHelloMessages = false
**.aodv.askGratuitousRREP = false
**.aodv.destinationOnlyFlag = false
**.aodv.rreqRetries = 3
**.aodv.rreqRatelimit = 20
**.aodv.rerrRatelimit = 20
**.aodv.ttlStart = 2
**.aodv.ttlIncrement = 2
**.aodv.ttlThreshold = 7
**.aodv.netDiameter = 30
**.aodv.nodeTraversalTime = 0.05s

##########################################################
#                Road Visualizer (2D Canvas)             #
##########################################################
*.visualizer.osgVisualizer.typename = ""
*.roadsCanvasVisualizer.lineColor = "firebrick4"
*.roadsCanvasVisualizer.lineWidth = 1

##########################################################
#                  Statistics Recording                  #
##########################################################
**.vector-recording = true
**.scalar-recording = true


##########################################################
#                GUI: Multi-Layer Visualizer             #
##########################################################

# 1. Disable imaginary propagation rays to eliminate screen clutter
*.visualizer.*.mediumVisualizer.displaySignals = false

# 2. Render PHYSICAL COMMUNICATION RANGE (Calculated Radio Circle)
#    Physical radio coverage boundary based on transmitter power (e.g., 10mW / 100mW)
*.visualizer.*.mediumVisualizer.displayCommunicationRanges = true
*.visualizer.*.mediumVisualizer.communicationRangeLineColor = "deepskyblue"
*.visualizer.*.mediumVisualizer.communicationRangeLineStyle = "solid"
*.visualizer.*.mediumVisualizer.communicationRangeLineWidth = 1.5

# 3. Render 1-HOP MAC DATA LINKS (Successful Unicast Frame & ACK)
*.visualizer.*.dataLinkVisualizer.displayLinks = true
*.visualizer.*.dataLinkVisualizer.lineColor = "gold"          # Gold color for 1-hop physical link
*.visualizer.*.dataLinkVisualizer.lineWidth = 2.5
*.visualizer.*.dataLinkVisualizer.lineStyle = "solid"
*.visualizer.*.dataLinkVisualizer.labelFormat = "%n"
*.visualizer.*.dataLinkVisualizer.labelColor = "darkorange"

# 4. Render END-TO-END AODV NETWORK ROUTES (Multi-Hop Paths)
*.visualizer.*.networkRouteVisualizer.displayRoutes = true
*.visualizer.*.networkRouteVisualizer.lineColor = "lime"      # Lime green for active AODV routes
*.visualizer.*.networkRouteVisualizer.lineWidth = 3.5
*.visualizer.*.networkRouteVisualizer.lineStyle = "solid"
*.visualizer.*.networkRouteVisualizer.labelColor = "forestgreen"



##########################################################
#     Config 1: AODV V2V (Vehicle-to-Vehicle) Ping       #
##########################################################
[Config AODV_V2V_Ping]
description = "V2V AODV routing simulation using ICMP Ping between moving vehicles"

# Vehicle 0 tests AODV route discovery toward Vehicle 1 while in motion
*.node[0].numApps = 1
*.node[0].app[0].typename = "PingApp"
*.node[0].app[0].destAddr = "node[1](ipv4)"
*.node[0].app[0].sendInterval = 1s
*.node[0].app[0].startTime = 3s
*.node[0].app[0].stopTime = 80s
*.node[0].app[0].printPing = true

# Other vehicles act purely as AODV forwarders
*.node[*].numApps = 0


##########################################################
#      Config 2: AODV V2V (Vehicle-to-Vehicle) UDP       #
##########################################################
[Config AODV_V2V_UDP]
description = "V2V AODV routing simulation with continuous UDP data transmission"

# Vehicle 1 acts as Server / Receiver (UDP Sink)
*.node[1].numApps = 1
*.node[1].app[0].typename = "UdpSink"
*.node[1].app[0].localPort = 5000

# Vehicle 0 transmits continuous UDP data to Vehicle 1 while driving
*.node[0].numApps = 1
*.node[0].app[0].typename = "UdpBasicApp"
*.node[0].app[0].destAddresses = "node[1](ipv4)"
*.node[0].app[0].destPort = 5000
*.node[0].app[0].messageLength = 512B
*.node[0].app[0].sendInterval = 1s
*.node[0].app[0].startTime = 3s
*.node[0].app[0].stopTime = 80s

# Other vehicles act purely as AODV forwarders
*.node[*].numApps = 0


##########################################################
#   Config 3: AODV V2I (Vehicle-to-Infrastructure RSU)   #
##########################################################
[Config AODV_V2I_RSU]
description = "V2I AODV routing simulation to a static Road-Side Unit (RSU)"

*.numRsu = 1

# Static RSU position at central intersection (1040m, 868m, 5m)
*.rsu[0].mobility.typename = "StationaryMobility"
*.rsu[0].mobility.initialX = 1040m
*.rsu[0].mobility.initialY = 868m
*.rsu[0].mobility.initialZ = 5m
*.rsu[0].mobility.initFromDisplayString = false

*.rsu[0].wlan[0].opMode = "p"
*.rsu[0].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.rsu[0].wlan[0].radio.bandName = "5.9 GHz"
*.rsu[0].wlan[0].radio.channelNumber = 3
*.rsu[0].wlan[0].radio.bandwidth = 10 MHz
*.rsu[0].wlan[0].radio.transmitter.power = 100mW

*.rsu[0].ipv4.configurator.typename = "HostAutoConfigurator"
*.rsu[0].ipv4.configurator.interfaces = "wlan0"
*.rsu[0].ipv4.configurator.addressBase = "10.0.0.0"
*.rsu[0].ipv4.configurator.netmask = "255.0.0.0"
*.rsu[0].ipv4.arp.typename = "GlobalArp"

# RSU acts as Central Telemetry Collector (UDP Sink)
*.rsu[0].numApps = 1
*.rsu[0].app[0].typename = "UdpSink"
*.rsu[0].app[0].localPort = 5000

# All moving vehicles send status reports to RSU via multi-hop AODV
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpBasicApp"
*.node[*].app[0].destAddresses = "rsu[0](ipv4)"
*.node[*].app[0].destPort = 5000
*.node[*].app[0].messageLength = 256B
*.node[*].app[0].sendInterval = uniform(2s, 4s)
*.node[*].app[0].startTime = uniform(2s, 5s)


##########################################################
#     Config 4: AODV with Periodic Hello Messages        #
##########################################################
[Config AODV_HelloMessages]
extends = AODV_V2V_UDP
description = "AODV with periodic HELLO messages (RFC 3561) for neighbor sensing"
**.aodv.useHelloMessages = true
**.aodv.helloInterval = 1s
**.aodv.allowedHelloLoss = 2
**.aodv.activeRouteTimeout = 3s


